[ids]
*

[main]

# ── macOS-style modifier layout (Apple keyboard) ─────────────────────────────
# Physical layout on a MacBook Pro:
#   control · option · command ─ space ─ command · option
#
# ⌘ (Command) → Control  : copy/paste/quit in apps and the terminal
# ⌃ (Control) → Super    : menu / window management (overview)
# Caps Lock              : Control (hold) / Escape (tap)

capslock = overload(control, esc)

# Command (Super) → Control   (Cmd+C = copy, Cmd+Q = quit, …)
leftmeta = layer(control)
rightmeta = layer(control)

# Control → Super/Meta        (overview, window shortcuts)
leftcontrol = layer(meta)
rightcontrol = layer(meta)

# On the ⌃ (Super) layer, C/V send the terminal's interrupt / literal-char
# instead of Super+C/V (which the shell grabs for the overview/menu).
[meta]
c = C-A-c
v = C-A-v
